<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta charset="utf-8">
<title>خارطة الطريق | SEEM PRIME</title>
<style>
@font-face{font-family:'Sora';font-weight:300;font-display:swap;src:url("./ds/fonts/sora-300.woff2") format("woff2")}
@font-face{font-family:'Sora';font-weight:400;font-display:swap;src:url("./ds/fonts/sora-400.woff2") format("woff2")}
@font-face{font-family:'Sora';font-weight:600;font-display:swap;src:url("./ds/fonts/sora-600.woff2") format("woff2")}
@font-face{font-family:'Sora';font-weight:700;font-display:swap;src:url("./ds/fonts/sora-700.woff2") format("woff2")}
@font-face{font-family:'IBM Plex Sans';font-weight:300;font-display:swap;src:url("./ds/fonts/ibm-plex-sans-300.woff2") format("woff2")}
@font-face{font-family:'IBM Plex Sans';font-weight:400;font-display:swap;src:url("./ds/fonts/ibm-plex-sans-400.woff2") format("woff2")}
@font-face{font-family:'IBM Plex Sans';font-weight:500;font-display:swap;src:url("./ds/fonts/ibm-plex-sans-500.woff2") format("woff2")}
@font-face{font-family:'IBM Plex Sans';font-weight:600;font-display:swap;src:url("./ds/fonts/ibm-plex-sans-600.woff2") format("woff2")}
@font-face{font-family:'IBM Plex Mono';font-weight:400;font-display:swap;src:url("./ds/fonts/ibm-plex-mono-400.woff2") format("woff2")}
@font-face{font-family:'IBM Plex Mono';font-weight:500;font-display:swap;src:url("./ds/fonts/ibm-plex-mono-500.woff2") format("woff2")}
@font-face{font-family:'IBM Plex Sans Arabic';font-weight:400;font-display:swap;src:url("./ds/fonts/ibm-plex-sans-arabic-400.woff2") format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'IBM Plex Sans Arabic';font-weight:400;font-display:swap;src:url("./ds/fonts/ibm-plex-sans-arabic-400-arabic.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:'IBM Plex Sans Arabic';font-weight:600;font-display:swap;src:url("./ds/fonts/ibm-plex-sans-arabic-600.woff2") format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'IBM Plex Sans Arabic';font-weight:600;font-display:swap;src:url("./ds/fonts/ibm-plex-sans-arabic-600-arabic.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFC}
:root{
--page:#f7f8f9;--card:#ffffff;--sunken:#f0f2f3;--tint:#f1f7f5;
--ink:#041815;--body:#2c3634;--muted:#677471;
--line:rgba(4,24,21,.10);--line2:rgba(4,24,21,.16);--line3:rgba(4,24,21,.28);
--sh:0 18px 40px rgba(4,24,21,.08);
--hdr:rgba(255,255,255,.86);--focus:#197069;--link:#12514e;
}
html[data-theme="dark"]{
--page:#041815;--card:rgba(255,255,255,.06);--sunken:#062621;--tint:#0c3e3d;
--ink:#ffffff;--body:rgba(255,255,255,.86);--muted:rgba(255,255,255,.62);
--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.18);--line3:rgba(255,255,255,.34);
--sh:none;--hdr:rgba(4,24,21,.88);--focus:#8fc4bb;--link:#ffffff;
}
body{margin:0;background:var(--page);transition:background .24s cubic-bezier(.2,.7,.3,1)}
a{color:var(--link);text-decoration:none}
a:hover{color:var(--ink);text-decoration:underline;text-decoration-color:#dc4b1c;text-underline-offset:4px}
:focus-visible{outline:2px solid var(--focus) !important;outline-offset:2px !important}
[data-sc]{opacity:0;transform:translateY(14px);transition:opacity .6s cubic-bezier(.16,.84,.44,1) var(--d,0ms),transform .6s cubic-bezier(.16,.84,.44,1) var(--d,0ms)}
[data-sc][data-in]{opacity:1;transform:none}
[data-stagger]{--d:calc(var(--i,0) * 70ms)}
@media (min-width:900px){[data-hdrnav]{display:flex !important}}
@media (min-width:620px){[data-hdrcta]{display:inline-flex !important}}
[dir="rtl"] [data-lbl]{font-family:'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif !important;letter-spacing:normal !important;text-transform:none !important}
@media (prefers-reduced-motion: reduce){[data-sc]{opacity:1;transform:none;transition:none}}
[data-cols="4"],[data-cols="5"]{display:grid;gap:clamp(18px,2.4vw,28px);grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){[data-cols="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}[data-cols="5"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1000px){[data-cols="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}[data-cols="5"]{grid-template-columns:repeat(5,minmax(0,1fr))}}
</style>
</helmet>
<div dir="{{ dir }}" lang="{{ lang }}" style="{{ rootStyle }}">

<span data-prog="" aria-hidden="true" style="position:fixed;inset-block-start:0;inset-inline-start:0;z-index:70;height:2px;width:0;background:#dc4b1c"></span>

<dc-import name="SiteHeader" lang="{{ lang }}" theme="{{ theme }}" active="roadmap" on-lang="{{ toggleLang }}" on-theme="{{ toggleTheme }}" hint-size="100%,80px"></dc-import>

<section aria-labelledby="pg-h" data-screen-label="Page masthead" style="position:relative;overflow:clip;background:#062621;color:#ffffff">
  <span aria-hidden="true" style="position:absolute;inset-block-start:0;inset-inline:0;height:9px;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.24) 0 1px,transparent 1px 28px);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)"></span>
  <div style="max-width:1200px;margin:0 auto;padding:clamp(120px,17vh,190px) clamp(16px,3vw,32px) clamp(48px,7vw,86px)">
    <nav aria-label="{{ t.crumbLabel }}" data-lbl="" style="display:flex;align-items:center;gap:10px;margin-block-end:clamp(22px,3vw,32px);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:rgba(255,255,255,.62)">
      <a href="index.dc.html" style="color:rgba(255,255,255,.74);text-decoration:none">{{ t.home }}</a>
      <span aria-hidden="true">/</span>
      <span style="color:#ffffff">{{ t.navRoadmap }}</span>
    </nav>
    <h1 id="pg-h" data-sc="" style="{{ pgH1Style }}">{{ t.roadmapH }}</h1>
    <p data-sc="" style="margin:clamp(18px,2.4vw,28px) 0 0;max-width:52ch;font-weight:300;font-size:clamp(16px,1.8vw,20px);line-height:1.6;color:rgba(255,255,255,.82)">{{ t.roadLead }}</p>
  </div>
</section>

<section aria-labelledby="rd-h" data-screen-label="Roadmap" style="background:var(--page)">
  <div style="max-width:1200px;margin:0 auto;padding:clamp(56px,8vw,96px) clamp(16px,3vw,32px)">
    <h2 id="rd-h" data-sc="" style="{{ h2Style }}">{{ t.phasesH }}</h2>
    <div data-cols="4" style="margin-block-start:clamp(32px,4vw,52px)">
      <sc-for list="{{ roadmap }}" as="r" hint-placeholder-count="4">
        <div data-sc="" data-stagger="" style="--i:{{ r.i }};display:flex;flex-direction:column;gap:16px;padding-block-start:20px;border-block-start:2px solid {{ r.rule }}">
          <span aria-hidden="true" style="{{ r.dot }}"></span>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:clamp(15px,1.8vw,19px);letter-spacing:-.01em;color:var(--ink)">{{ r.year }}</span>
          <span style="font-size:15px;line-height:1.5;color:{{ r.labelColor }}">{{ r.label }}</span>
        </div>
      </sc-for>
    </div>
  </div>
</section>

<section aria-labelledby="kp-h" data-screen-label="2030 targets" style="background:#062621;color:#ffffff">
  <div style="max-width:1200px;margin:0 auto;padding:clamp(56px,8vw,96px) clamp(16px,3vw,32px)">
    <h2 id="kp-h" data-sc="" style="{{ h2OnBrand }}">{{ t.kpiH }}</h2>
    <p data-sc="" style="margin:18px 0 clamp(34px,4vw,56px);max-width:56ch;font-weight:300;font-size:clamp(16px,1.7vw,18px);line-height:1.62;color:rgba(255,255,255,.74)">{{ t.kpiNote }}</p>
    <div data-cols="5">
      <sc-for list="{{ kpis }}" as="k" hint-placeholder-count="5">
        <div data-sc="" data-stagger="" style="--i:{{ k.i }};display:flex;flex-direction:column;gap:14px;padding-block-start:20px;border-block-start:1px solid rgba(255,255,255,.18)">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(255,255,255,.62)">{{ k.no }}</span>
          <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
            <span data-count="{{ k.target }}" data-suffix="{{ k.suffix }}" style="{{ k.numStyle }}">{{ k.value }}</span>
            <span data-lbl="" style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:rgba(255,255,255,.62)">{{ k.unit }}</span>
          </div>
          <span aria-hidden="true" style="width:28px;height:3px;background:{{ k.tick }}"></span>
          <span data-lbl="" style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.74)">{{ k.label }}</span>
        </div>
      </sc-for>
    </div>
  </div>
</section>

<dc-import name="SiteCta" lang="{{ lang }}" page="roadmap" hint-size="100%,520px"></dc-import>

<dc-import name="SiteFooter" lang="{{ lang }}" hint-size="100%,420px"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;options&quot;:[&quot;#dc4b1c&quot;,&quot;#057078&quot;,&quot;#8a6a3b&quot;],&quot;default&quot;:&quot;#dc4b1c&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Accent&quot;}}">
const AR = {
  home:'الرئيسية', crumbLabel:'مسار التنقل', navRoadmap:'خارطة الطريق',
  roadmapH:'خارطة الطريق حتى 2030',
  roadLead:'أربع مراحل من التأسيس إلى الريادة، وخمسة أهداف قابلة للقياس.',
  eyePhases:'المراحل', phasesH:'من التأسيس إلى الريادة',
  roadmap:[['2025','التأسيس'],['2026-2028','التوسع داخل المملكة'],['2029','التوسع الإقليمي'],['2030','الريادة في بناء المنظومات الاقتصادية']],
  eyeKpi:'أثر قابل للقياس', kpiH:'الأهداف الاستراتيجية بحلول 2030',
  kpiNote:'الحجم الذي نبني نحوه — موزّعاً على منصات المنظومة وقطاعاتها.',
  kpis:[['40','منصة أعمال',''],['1','محفظة استثمارية','مليار ريال'],['200','فرصة عمل',''],['50','شراكة استراتيجية',''],['10%','نمو سنوي','سنوياً']],
  nextLabel:'الخطوة التالية', nextH:'كن جزءاً من المرحلة القادمة', cta:'تواصل معنا'
};
const EN = {
  home:'Home', crumbLabel:'Breadcrumb', navRoadmap:'Roadmap',
  roadmapH:'The roadmap to 2030',
  roadLead:'Four phases from foundation to leadership, and five measurable targets.',
  eyePhases:'The phases', phasesH:'From foundation to leadership',
  roadmap:[['2025','Foundation'],['2026-2028','Saudi expansion'],['2029','Regional expansion'],['2030','Leading economic ecosystem platform']],
  eyeKpi:'Measured impact', kpiH:'Strategic targets by 2030',
  kpiNote:'The scale we are building toward — deployed across the ecosystem\u2019s platforms and sectors.',
  kpis:[['40','Business platforms',''],['1','Investment portfolio','SR billion'],['200','Jobs created',''],['50','Strategic partnerships',''],['10%','Annual growth','per year']],
  nextLabel:'Next', nextH:'Be part of the next phase', cta:'Contact us'
};

class Component extends DCLogic {
  state = { lang: 'ar', theme: 'light' };

  countEl(el) {
    if (el.hasAttribute('data-counted')) return;
    const to = parseFloat(el.getAttribute('data-count'));
    if (!Number.isFinite(to)) return;
    const suffix = el.getAttribute('data-suffix') || '';
    const settle = () => { el.textContent = to + suffix; el.setAttribute('data-counted', '1'); };
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { settle(); return; }
    const dur = 1400;
    let t0 = null;
    const step = now => {
      if (!el.isConnected) return;
      if (t0 === null) t0 = now;
      const p = Math.min(1, (now - t0) / dur);
      el.textContent = Math.round(to * (1 - Math.pow(1 - p, 4))) + suffix;
      if (p < 1) { requestAnimationFrame(step); return; }
      settle();
    };
    requestAnimationFrame(step);
  }
  // one shared reading-progress hairline across every page of the site
  progressPass() {
    const bar = document.querySelector('[data-prog]');
    if (!bar) return;
    const max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    bar.style.width = (Math.min(1, (window.scrollY || 0) / max) * 100).toFixed(2) + '%';
  }
  revealPass() {
    const h = window.innerHeight || 800;
    document.querySelectorAll('[data-sc]:not([data-in])').forEach(n => {
      const r = n.getBoundingClientRect();
      if (r.top < h * 0.94) {
        n.setAttribute('data-in', '1');
        n.querySelectorAll('[data-count]').forEach(el => this.countEl(el));
      }
    });
  }
  componentDidMount() {
    try {
      const l = window.localStorage.getItem('seemprime-lang');
      if (l === 'en' || l === 'ar') this.setState({ lang: l });
      const th = window.localStorage.getItem('seemprime-theme');
      const initial = (th === 'light' || th === 'dark') ? th : 'light';
      this.applyTheme(initial);
      this.setState({ theme: initial });
    } catch (e) { this.applyTheme('light'); }
    this._on = () => {
      this.progressPass();
      const now = Date.now();
      const wait = 60 - (now - (this._last || 0));
      if (wait > 0) { clearTimeout(this._trail); this._trail = setTimeout(() => { this._last = 0; this._on(); }, wait + 10); return; }
      this._last = now;
      this.revealPass();
    };
    window.addEventListener('scroll', this._on, { passive: true });
    window.addEventListener('resize', this._on, { passive: true });
    this.revealPass();
    this.progressPass();
    this._poll = setInterval(() => this.revealPass(), 500);
  }
  componentDidUpdate() { this.revealPass(); }
  componentWillUnmount() {
    window.removeEventListener('scroll', this._on);
    window.removeEventListener('resize', this._on);
    clearInterval(this._poll); clearTimeout(this._trail);
  }
  applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.style.colorScheme = theme;
  }
  renderVals() {
    const ar = this.state.lang === 'ar';
    const t = ar ? AR : EN;
    const accent = this.props.accent || '#dc4b1c';
    const bodyFont = ar ? "'IBM Plex Sans Arabic',system-ui,sans-serif" : "'IBM Plex Sans',system-ui,sans-serif";
    const dispFont = ar ? "'IBM Plex Sans Arabic',system-ui,sans-serif" : "'Sora',system-ui,sans-serif";
    const lbl = ';font-size:11px;font-weight:500;letter-spacing:' + (ar ? 'normal' : '.18em') +
      ';text-transform:' + (ar ? 'none' : 'uppercase') + ';color:';
    return {
      t, lang: this.state.lang, theme: this.state.theme, dir: ar ? 'rtl' : 'ltr', arrow: ar ? '←' : '→',
      rootStyle: 'background:var(--page);color:var(--body);font-family:' + bodyFont +
        ';font-size:16px;line-height:' + (ar ? '1.75' : '1.62') + ';-webkit-font-smoothing:antialiased',
      toggleLang: () => {
        const lang = ar ? 'en' : 'ar';
        try { window.localStorage.setItem('seemprime-lang', lang); } catch (e) {}
        this.setState({ lang });
      },
      toggleTheme: () => {
        const theme = this.state.theme === 'light' ? 'dark' : 'light';
        try { window.localStorage.setItem('seemprime-theme', theme); } catch (e) {}
        this.applyTheme(theme);
        this.setState({ theme });
      },
      pgH1Style: 'margin:0;max-width:22ch;font-family:' + dispFont + ';font-weight:' + (ar ? '600' : '300') +
        ';font-size:clamp(30px,4.6vw,66px);line-height:' + (ar ? '1.26' : '1.04') +
        ';letter-spacing:' + (ar ? '0' : '-.025em') + ';color:#ffffff;text-wrap:pretty',
      h2Style: 'margin:0;font-family:' + dispFont + ';font-weight:' + (ar ? '600' : '300') +
        ';font-size:clamp(26px,3.6vw,52px);line-height:' + (ar ? '1.3' : '1.08') +
        ';letter-spacing:' + (ar ? '0' : '-.02em') + ';color:var(--ink);text-wrap:pretty',
      h2OnBrand: 'margin:0;font-family:' + dispFont + ';font-weight:' + (ar ? '600' : '300') +
        ';font-size:clamp(26px,3.6vw,52px);line-height:' + (ar ? '1.3' : '1.08') +
        ';letter-spacing:' + (ar ? '0' : '-.02em') + ';color:#ffffff;text-wrap:pretty',
      eyeStyle: 'margin:0 0 16px;display:flex;align-items:center;gap:14px;font-family:' + dispFont + lbl + 'var(--body)',
      eyeOnBrand: 'font-family:' + dispFont + lbl + 'rgba(255,255,255,.78)',
      eyeOnBrandRow: 'margin:0 0 16px;display:flex;align-items:center;gap:14px;font-family:' + dispFont + lbl + 'rgba(255,255,255,.74)',
      roadmap: t.roadmap.map(([year, label], i) => {
        const last = i === 3;
        return {
          i, year, label,
          rule: last ? accent : 'var(--line2)',
          labelColor: last ? 'var(--ink)' : 'var(--muted)',
          dot: 'display:block;width:' + (last ? '44px' : '22px') + ';height:10px;border-radius:999px;background:' +
            (last ? accent : 'var(--muted)') + ';opacity:' + (last ? '1' : '.5')
        };
      }),
      kpis: t.kpis.map(([value, label, unit], i) => {
        const lead = i === 1;
        const m = /^([\d.]+)(.*)$/.exec(value) || [];
        return {
          i, value, label, unit: unit || '', no: '0' + (i + 1),
          target: m[1] || '', suffix: m[2] || '',
          tick: lead ? accent : 'rgba(255,255,255,.34)',
          numStyle: "font-family:'Sora',sans-serif;font-weight:300;font-size:clamp(40px,5vw,64px);line-height:1;" +
            'letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:' + (lead ? accent : '#ffffff')
        };
      })
    };
  }
}

</script>
</body>
</html>
