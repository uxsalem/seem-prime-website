<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section aria-labelledby="cta-h" data-screen-label="Closing CTA" style="position:relative;overflow:clip;display:flex;align-items:center;min-height:clamp(420px,56vh,600px);background:#041815;color:#ffffff">
  <span data-ctaplate="" aria-hidden="true" style="{{ plateStyle }}"></span>
  <span aria-hidden="true" style="position:absolute;inset:0;background:linear-gradient(to top,rgba(4,24,21,.94) 0%,rgba(4,24,21,.72) 46%,rgba(4,24,21,.4) 100%)"></span>
  <span aria-hidden="true" style="position:absolute;inset-block-start:0;inset-inline:0;height:9px;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.24) 0 1px,transparent 1px 28px);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)"></span>
  <span aria-hidden="true" style="position:absolute;inset-block:0;inset-inline-end:0;width:3px;background:#dc4b1c"></span>
  <div style="position:relative;width:100%;max-width:1200px;margin:0 auto;padding:clamp(52px,7vw,92px) clamp(16px,3vw,32px)">
    <h2 id="cta-h" style="{{ hStyle }}">{{ line }}</h2>
    <p style="margin:clamp(16px,2.2vw,24px) 0 clamp(30px,4vw,44px);max-width:56ch;font-weight:300;font-size:clamp(16px,1.7vw,19px);line-height:1.62;color:rgba(255,255,255,.84)">{{ t.body }}</p>
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:14px">
      <a href="contact.dc.html" style="{{ primaryStyle }}" style-hover="transform:translateY(-3px);box-shadow:0 20px 42px rgba(4,24,21,.48);text-decoration:none" style-active="transform:scale(.985)">
        {{ t.primary }}<span aria-hidden="true" style="font-size:17px">{{ arrow }}</span>
      </a>
      <a href="{{ secondHref }}" style="{{ ghostStyle }}" style-hover="background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.7);transform:translateY(-3px);text-decoration:none">{{ secondLabel }}</a>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:clamp(16px,3vw,34px);margin-block-start:clamp(32px,4.4vw,52px);padding-block-start:22px;border-block-start:1px solid rgba(255,255,255,.2);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.04em;color:rgba(255,255,255,.72)">
      <a href="mailto:info@seem.sa" style="color:#ffffff;text-decoration:none;opacity:.86" style-hover="opacity:1">info@seem.sa</a>
      <a href="tel:+966536800016" style="color:#ffffff;text-decoration:none;opacity:.86" style-hover="opacity:1"><span dir="ltr">+966 53 680 0016</span></a>
      <span data-lbl="">{{ t.city }}</span>
    </div>
  </div>
</section>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;lang&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;ar&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;page&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;about&quot;,&quot;model&quot;,&quot;strategy&quot;,&quot;ecosystem&quot;,&quot;roadmap&quot;],&quot;default&quot;:&quot;about&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const PLATES = {
  model: './ds/img/diagonal-glass-planes.png',
  ecosystem: './ds/img/blade-split-green-white.png',
  roadmap: './ds/img/architecture-green-fins.png',
  about: './ds/img/glass-capsule-green.png',
  strategy: './ds/img/white-green-planes.png'
};
const CTA = {
  ar: {
    eyebrow:'ابدأ الحوار', primary:'تواصل معنا',
    body:'نرحّب بالمستثمرين، والشركاء، والجهات الحكومية. أخبرنا بما تبحث عنه وسيتواصل معك فريقنا مباشرة.',
    city:'جدة، المملكة العربية السعودية',
    lines:{
      about:'ابنِ مع من يبني المنظومة',
      model:'ضع منصتك داخل نموذج يعمل',
      strategy:'شاركنا في المرحلة القادمة',
      ecosystem:'هل تبحث عن شراكة أو استثمار؟',
      roadmap:'كن جزءاً من الطريق حتى 2030'
    },
    second:{
      about:['منظومتنا','ecosystem.dc.html'],
      model:['منصات المحفظة','ecosystem.dc.html'],
      strategy:['نموذج الأعمال','model.dc.html'],
      ecosystem:['نموذج الأعمال','model.dc.html'],
      roadmap:['الاستراتيجية','strategy.dc.html']
    }
  },
  en: {
    eyebrow:'Get in touch', primary:'Contact us',
    body:'We welcome investors, partners and government entities. Tell us what you are looking for and our team will come back to you directly.',
    city:'Jeddah, Saudi Arabia',
    lines:{
      about:'Build with the people building the ecosystem',
      model:'Put your platform inside a model that works',
      strategy:'Join us for the next phase',
      ecosystem:'Looking to partner or invest?',
      roadmap:'Be part of the road to 2030'
    },
    second:{
      about:['Our ecosystem','ecosystem.dc.html'],
      model:['Portfolio platforms','ecosystem.dc.html'],
      strategy:['Business model','model.dc.html'],
      ecosystem:['Business model','model.dc.html'],
      roadmap:['Strategy','strategy.dc.html']
    }
  }
};

class Component extends DCLogic {
  // the plate drifts against the page so the closing band has the same depth as the hero
  componentDidMount() {
    this._on = () => {
      const p = document.querySelector('[data-ctaplate]');
      if (!p) return;
      const sec = p.parentElement.getBoundingClientRect();
      p.style.transform = 'translate3d(0,' + ((window.innerHeight - sec.top) * -0.055).toFixed(1) + 'px,0) scale(1.12)';
    };
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      window.addEventListener('scroll', this._on, { passive: true });
      this._on();
    }
  }
  componentWillUnmount() { window.removeEventListener('scroll', this._on); }

  renderVals() {
    const lang = this.props.lang === 'en' ? 'en' : 'ar';
    const ar = lang === 'ar';
    const t = CTA[lang];
    const page = this.props.page || 'about';
    const dispFont = ar ? "'IBM Plex Sans Arabic',system-ui,sans-serif" : "'Sora',system-ui,sans-serif";
    const second = t.second[page] || t.second.about;
    return {
      t, arrow: ar ? '←' : '→',
      line: t.lines[page] || t.lines.about,
      secondLabel: second[0], secondHref: second[1],
      plateStyle: 'position:absolute;inset:-10% 0;background-image:url("' + (PLATES[page] || PLATES.about) +
        '");background-size:cover;background-position:center;will-change:transform',
      eyeStyle: 'font-family:' + dispFont + ';font-size:11px;font-weight:500;letter-spacing:' +
        (ar ? 'normal' : '.18em') + ';text-transform:' + (ar ? 'none' : 'uppercase') + ';color:rgba(255,255,255,.9)',
      hStyle: 'margin:0;max-width:24ch;font-family:' + dispFont + ';font-weight:' + (ar ? '600' : '300') +
        ';font-size:clamp(28px,4.2vw,58px);line-height:' + (ar ? '1.28' : '1.04') +
        ';letter-spacing:' + (ar ? '0' : '-.025em') + ';color:#ffffff;text-wrap:pretty',
      primaryStyle: 'box-sizing:border-box;display:inline-flex;align-items:center;gap:12px;height:58px;padding:0 36px;border-radius:999px;' +
        'background:#ffffff;color:#041815;font-family:inherit;font-size:16px;font-weight:600;text-decoration:none;' +
        'box-shadow:0 12px 30px rgba(4,24,21,.32);transition:transform .2s cubic-bezier(.2,.7,.3,1),box-shadow .2s',
      ghostStyle: 'box-sizing:border-box;display:inline-flex;align-items:center;height:58px;padding:0 30px;border-radius:999px;' +
        'border:1px solid rgba(255,255,255,.36);color:#ffffff;font-family:inherit;font-size:15px;font-weight:500;' +
        'text-decoration:none;transition:background .2s,border-color .2s,transform .2s cubic-bezier(.2,.7,.3,1)'
    };
  }
}

</script>
</body>
</html>
