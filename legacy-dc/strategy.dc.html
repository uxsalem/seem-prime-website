:root{
--page:#f7f8f9;--card:#ffffff;--sunken:#f0f2f3;--tint:#f1f7f5;
--ink:#041815;--body:#2c3634;--muted:#677471;
--line:rgba(4,24,21,.10);--line2:rgba(4,24,21,.16);--line3:rgba(4,24,21,.28);
--sh:0 18px 40px rgba(4,24,21,.08);
--hdr:rgba(255,255,255,.86);--focus:#197069;--link:#12514e;
}
html[data-theme="dark"]{
--page:#041815;--card:rgba(255,255,255,.06);--sunken:#062621;--tint:#0c3e3d;
--ink:#ffffff;--body:rgba(255,255,255,.86);--muted:rgba(255,255,255,.62);
--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.18);--line3:rgba(255,255,255,.34);
--sh:none;--hdr:rgba(4,24,21,.88);--focus:#8fc4bb;--link:#ffffff;
}
body{margin:0;background:var(--page);transition:background .24s cubic-bezier(.2,.7,.3,1)}
a{color:var(--link);text-decoration:none}
a:hover{color:var(--ink);text-decoration:underline;text-decoration-color:#dc4b1c;text-underline-offset:4px}
:focus-visible{outline:2px solid var(--focus) !important;outline-offset:2px !important}
[data-sc]{opacity:0;transform:translateY(14px);transition:opacity .6s cubic-bezier(.16,.84,.44,1) var(--d,0ms),transform .6s cubic-bezier(.16,.84,.44,1) var(--d,0ms)}
[data-sc="x"]{transform:translateX(16px)}
[data-sc][data-in]{opacity:1;transform:none}
[data-stagger]{--d:calc(var(--i,0) * 70ms)}
@media (min-width:900px){[data-hdrnav]{display:flex !important}}
@media (min-width:620px){[data-hdrcta]{display:inline-flex !important}}
[dir="rtl"] [data-lbl]{font-family:'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif !important;letter-spacing:normal !important;text-transform:none !important}
@media (prefers-reduced-motion: reduce){[data-sc]{opacity:1;transform:none;transition:none}}
[data-split]{display:grid;gap:clamp(32px,5vw,80px);grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){[data-split]{grid-template-columns:1.12fr .88fr;align-items:start}}
[data-vmpin]{position:relative}
[data-vmword]{opacity:1}
[data-vmbar]{transform:scaleX(0)}
[data-vmtext]+[data-vmtext]{margin-block-start:clamp(40px,8vw,72px);padding-block-start:clamp(40px,8vw,72px);border-block-start:1px solid rgba(255,255,255,.16)}
@media (min-width:900px) and (prefers-reduced-motion: no-preference){[data-vmpin]{height:280vh}[data-vmstick]{position:sticky;inset-block-start:0;height:100vh;display:flex;align-items:center;overflow:clip}[data-vmstage]{display:grid}[data-vmtext]{grid-area:1/1}[data-vmtext]+[data-vmtext]{margin-block-start:0;padding-block-start:0;border-block-start:0}}
[data-rail]{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-block-end:6px}
[data-rail]::-webkit-scrollbar{display:none}
[data-rail]>*{scroll-snap-align:start}
</style>

<span data-prog="" aria-hidden="true" style="position:fixed;inset-block-start:0;inset-inline-start:0;z-index:70;height:2px;width:0;background:#dc4b1c"></span>

<dc-import name="SiteHeader" lang="{{ lang }}" theme="{{ theme }}" active="strategy" on-lang="{{ toggleLang }}" on-theme="{{ toggleTheme }}" hint-size="100%,80px"></dc-import>

<section aria-labelledby="pg-h" data-screen-label="Page masthead" style="position:relative;overflow:clip;background:#062621;color:#ffffff">

  <div style="max-width:1200px;margin:0 auto;padding:clamp(120px,17vh,190px) clamp(16px,3vw,32px) clamp(48px,7vw,86px)">

      <a href="index.dc.html" style="color:rgba(255,255,255,.74);text-decoration:none">{{ t.home }}</a>

      <span style="color:#ffffff">{{ t.navStrategy }}</span>

    <h1 id="pg-h" data-sc="" style="{{ pgH1Style }}">{{ t.pageH }}</h1>
    <p data-sc="" style="margin:clamp(18px,2.4vw,28px) 0 0;max-width:54ch;font-weight:300;font-size:clamp(16px,1.8vw,20px);line-height:1.6;color:rgba(255,255,255,.82)">{{ t.pageLead }}</p>

</section>

class Component extends DCLogic {
  state = { lang: 'ar', theme: 'light', openPillar: 0, vm: 0 };

  // one shared reading-progress hairline across every page of the site
  progressPass() {
    const bar = document.querySelector('[data-prog]');
    if (!bar) return;
    const max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    bar.style.width = (Math.min(1, (window.scrollY || 0) / max) * 100).toFixed(2) + '%';
  }
  revealPass() {
    const h = window.innerHeight || 800;
    document.querySelectorAll('[data-sc]:not([data-in])').forEach(n => {
      const r = n.getBoundingClientRect();
      if (r.top < h * 0.94) n.setAttribute('data-in', '1');
    });
  }
  // Style holes inside sc-for do not re-resolve on state change, so every interactive visual
  // state is written straight to the DOM from one pass, after mount and after every render.
  paintState() {
    const openP = this.state.openPillar;
    const acc = this.props.accent || '#dc4b1c';
    document.querySelectorAll('[data-ccol]').forEach(col => {
      const on = +col.getAttribute('data-ccol') === openP;
      const cap = col.querySelector('[data-ccap]');
      if (cap) cap.style.background = on ? acc : 'transparent';
      col.querySelectorAll('[data-cseg]').forEach(s => {
        s.style.background = on ? '#062621' : 'transparent';
        s.style.borderColor = on ? 'transparent' : 'var(--line2)';
      });
    });
    document.querySelectorAll('[data-ctick]').forEach(el => {
      el.style.color = (+el.getAttribute('data-ctick') === openP) ? acc : 'var(--muted)';
    });
    const vmPinned = window.matchMedia('(min-width: 900px)').matches &&
      !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    document.querySelectorAll('[data-vmtext]').forEach(n => {
      n.style.opacity = (!vmPinned || +n.getAttribute('data-vmtext') === this.state.vm) ? '1' : '0';
    });
  }
  // Words ignite in sequence across the pinned travel; below the pin breakpoint they are
  // simply lit, so nothing depends on scrolling to become readable.
  updateVm() {
    const pin = document.querySelector('[data-vmpin]');
    if (!pin) return;
    const bar = pin.querySelector('[data-vmbar]');
    const vh = window.innerHeight || 800;
    const r = pin.getBoundingClientRect();
    const pinned = window.matchMedia('(min-width: 900px)').matches &&
      !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const travel = r.height - vh;
    const blocks = pin.querySelectorAll('[data-vmtext]');
    if (!pinned || travel < 160) {
      pin.querySelectorAll('[data-vmword]').forEach(el => { el.style.opacity = '1'; });
      if (bar) bar.style.transform = 'scaleX(1)';
      return;
    }
    const p = Math.max(0, Math.min(1, (-r.top) / travel));
    const idx = p < 0.5 ? 0 : 1;
    const local = idx === 0 ? p / 0.5 : (p - 0.5) / 0.5;
    blocks.forEach(node => {
      const own = +node.getAttribute('data-vmtext');
      const words = node.querySelectorAll('[data-vmword]');
      const n = words.length || 1;
      words.forEach((el, i) => {
        const tt = own === idx ? Math.max(0, Math.min(1, local * (n + 7) - i)) : (own < idx ? 1 : 0);
        el.style.opacity = (0.18 + 0.82 * tt).toFixed(3);
      });
    });
    if (bar) bar.style.transform = 'scaleX(' + p.toFixed(4) + ')';
    if (idx !== this.state.vm) this.setState({ vm: idx });
  }
  scrollRail(sel, dir) {
    const el = document.querySelector(sel);
    if (!el) return;
    const card = el.firstElementChild;
    const step = (card ? card.getBoundingClientRect().width : 280) + 16;
    el.scrollBy({ left: step * dir * (this.state.lang === 'ar' ? -1 : 1), behavior: 'smooth' });
  }
  componentDidMount() {
    try {
      const l = window.localStorage.getItem('seemprime-lang');
      if (l === 'en' || l === 'ar') this.setState({ lang: l });
      const th = window.localStorage.getItem('seemprime-theme');
      const initial = (th === 'light' || th === 'dark') ? th : 'light';
      this.applyTheme(initial);
      this.setState({ theme: initial });
    } catch (e) { this.applyTheme('light'); }
    this._on = () => {
      this.progressPass();
      const now = Date.now();
      const wait = 60 - (now - (this._last || 0));
      if (wait > 0) { clearTimeout(this._trail); this._trail = setTimeout(() => { this._last = 0; this._on(); }, wait + 10); return; }
      this._last = now;
      this.revealPass();
      this.updateVm();
    };
    window.addEventListener('scroll', this._on, { passive: true });
    window.addEventListener('resize', this._on, { passive: true });
    this.revealPass();
    this.paintState();
    this.updateVm();
    this._poll = setInterval(() => this.revealPass(), 500);
  }
  componentDidUpdate() { this.revealPass(); this.paintState(); }
  componentWillUnmount() {
    window.removeEventListener('scroll', this._on);
    window.removeEventListener('resize', this._on);
    clearInterval(this._poll); clearTimeout(this._trail);
  }
  applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.style.colorScheme = theme;
  }
  renderVals() {
    const ar = this.state.lang === 'ar';
    const t = ar ? AR : EN;
    const accent = this.props.accent || '#dc4b1c';
    const bodyFont = ar ? "'IBM Plex Sans Arabic',system-ui,sans-serif" : "'IBM Plex Sans',system-ui,sans-serif";
    const dispFont = ar ? "'IBM Plex Sans Arabic',system-ui,sans-serif" : "'Sora',system-ui,sans-serif";
    const lbl = ';font-size:11px;font-weight:500;letter-spacing:' + (ar ? 'normal' : '.18em') +
      ';text-transform:' + (ar ? 'none' : 'uppercase') + ';color:';
    return {
      t, lang: this.state.lang, theme: this.state.theme, dir: ar ? 'rtl' : 'ltr',
      prevGlyph: ar ? '→' : '←', nextGlyph: ar ? '←' : '→',
      barOrigin: ar ? 'right center' : 'left center',
      rootStyle: 'background:var(--page);color:var(--body);font-family:' + bodyFont +
        ';font-size:16px;line-height:' + (ar ? '1.75' : '1.62') + ';-webkit-font-smoothing:antialiased',
      toggleLang: () => {
        const lang = ar ? 'en' : 'ar';
        try { window.localStorage.setItem('seemprime-lang', lang); } catch (e) {}
        this.setState({ lang });
      },
      toggleTheme: () => {
        const theme = this.state.theme === 'light' ? 'dark' : 'light';
        try { window.localStorage.setItem('seemprime-theme', theme); } catch (e) {}
        this.applyTheme(theme);
        this.setState({ theme });
      },
      pgH1Style: 'margin:0;max-width:22ch;font-family:' + dispFont + ';font-weight:' + (ar ? '600' : '300') +
        ';font-size:clamp(30px,4.6vw,66px);line-height:' + (ar ? '1.26' : '1.04') +
        ';letter-spacing:' + (ar ? '0' : '-.025em') + ';color:#ffffff;text-wrap:pretty',
      h2Style: 'margin:0;font-family:' + dispFont + ';font-weight:' + (ar ? '600' : '300') +
        ';font-size:clamp(26px,3.6vw,52px);line-height:' + (ar ? '1.3' : '1.08') +
        ';letter-spacing:' + (ar ? '0' : '-.02em') + ';color:var(--ink);text-wrap:pretty',
      eyeStyle: 'margin:0 0 16px;display:flex;align-items:center;gap:14px;font-family:' + dispFont + lbl + 'var(--body)',
      eyeOnBrand: 'font-family:' + dispFont + lbl + 'rgba(255,255,255,.78)',
      eyeOnBrandRow: 'margin:0;display:flex;align-items:center;gap:14px;font-family:' + dispFont + lbl + 'rgba(255,255,255,.74)',
      ticks: [0, 1, 2, 3, 4].map(i => ({
        i, style: 'width:' + (i === 0 ? '26px' : '13px') + ';height:1px;background:' +
          (i === 0 ? accent : 'rgba(255,255,255,.32)')
      })),
      statements: [
        { i: 0, no: '01', label: t.visionLabel, text: t.vision },
        { i: 1, no: '02', label: t.missionLabel, text: t.mission }
      ].map(s => ({
        i: s.i, no: s.no, label: s.label,
        words: s.text.split(/\s+/).filter(Boolean).map((text, i) => ({
          i, text, style: 'display:inline-block;margin-inline-end:.26em'
        })),
        block: 'opacity:' + (s.i === this.state.vm ? '1' : '0') +
          ';transition:opacity .45s cubic-bezier(.2,.7,.3,1)',
        noStyle: "font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;color:" +
          (s.i === 0 ? accent : 'rgba(255,255,255,.6)'),
        labelStyle: 'font-family:' + dispFont + lbl + 'rgba(255,255,255,.7)',
        textStyle: 'margin:0;max-width:min(100%,1040px);font-family:' + bodyFont +
          ';font-weight:' + (ar ? '400' : '300') + ';font-size:clamp(26px,4.6vw,64px);line-height:' +
          (ar ? '1.42' : '1.1') + ';letter-spacing:' + (ar ? '0' : '-.03em') + ';color:#ffffff;text-wrap:pretty'
      })),
      // Five pillars carrying one discipline is a colonnade: five equal columns on one ground
      // line under one beam. The selected column fills bottom-up, segment by segment, which is
      // literally pillar 01's copy — and it shares the accordion's state, so the two stay in sync.
      colonnade: t.pillars.map(([text], i) => {
        const on = this.state.openPillar === i;
        return {
          i, no: '0' + (i + 1), label: text, pressed: on ? 'true' : 'false',
          select: () => this.setState({ openPillar: on ? -1 : i }),
          col: 'all:unset;box-sizing:border-box;cursor:pointer;min-width:0;height:100%;' +
            'display:flex;flex-direction:column-reverse;gap:3px;padding-block-end:0',
          capital: 'flex:0 0 auto;height:3px;margin-block-end:3px;order:1',
          segments: [0, 1, 2, 3, 4, 5, 6].map(k => ({ k, style: 'flex:1 1 0;border:1px solid var(--line2)' })),
          tick: "font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-align:center;color:var(--muted)"
        };
      }),
      pillars: t.pillars.map(([text, note], i) => {
        const open = this.state.openPillar === i;
        return {
          i, text, note, no: '0' + (i + 1),
          expanded: open ? 'true' : 'false', isOpen: open, isShut: !open,
          toggle: () => this.setState({ openPillar: open ? -1 : i })
        };
      }),
      sectorCount: '0' + t.sectors.length,
      sectors: t.sectors.map((text, i) => ({ text, i, no: '0' + (i + 1), slot: 'sp-sector-' + i, ph: t.sectorPh + text })),
      railBtn: 'all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:44px;border-radius:999px;' +
        'border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:16px;' +
        'color:var(--ink);background:var(--card);transition:border-color .18s,transform .18s',
      railPrev: () => this.scrollRail('[data-sectorrail]', -1),
      railNext: () => this.scrollRail('[data-sectorrail]', 1)
    };
  }
}

</script>
