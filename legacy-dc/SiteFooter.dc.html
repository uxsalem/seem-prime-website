<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
[data-fcols]{grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){[data-fcols]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1000px){[data-fcols]{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</helmet>
<footer data-screen-label="Footer" style="position:relative;overflow:clip;background:#041815;color:#ffffff">
  <div style="position:relative;max-width:1200px;margin:0 auto;padding:clamp(48px,6vw,80px) clamp(16px,3vw,32px) 0">
    <div data-fcols="" style="display:grid;gap:clamp(28px,4vw,48px);padding-block-end:clamp(36px,5vw,56px)">
      <div style="display:flex;flex-direction:column;gap:18px">
        <div style="display:flex;align-items:center;gap:12px;color:#ffffff">{{ mark }}<span style="font-family:'Sora',sans-serif;font-weight:600;font-size:13px;letter-spacing:.34em;text-transform:uppercase">SEEM PRIME</span></div>
        <p style="margin:0;max-width:34ch;font-weight:300;font-size:14px;line-height:1.62;color:rgba(255,255,255,.74)">{{ t.footerText }}</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <span data-lbl="" style="{{ capStyle }}">{{ t.fCompany }}</span>
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
          <a href="{{ l.href }}" style="font-size:14px;color:#ffffff;text-decoration:none;opacity:.82" style-hover="opacity:1">{{ l.label }}</a>
        </sc-for>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <span data-lbl="" style="{{ capStyle }}">{{ t.fContact }}</span>
        <span style="max-width:26ch;font-size:14px;line-height:1.6;color:rgba(255,255,255,.74)">{{ t.address }}</span>
        <a href="mailto:info@seem.sa" style="font-size:14px;color:#ffffff;text-decoration:none;opacity:.82" style-hover="opacity:1">info@seem.sa</a>
        <a href="tel:+966536800016" style="font-family:'IBM Plex Mono',monospace;font-size:14px;color:#ffffff;text-decoration:none;opacity:.82" style-hover="opacity:1"><span dir="ltr">+966 53 680 0016</span></a>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <span data-lbl="" style="{{ capStyle }}">{{ t.nlLabel }}</span>
        <p style="margin:0;max-width:30ch;font-size:14px;line-height:1.6;color:rgba(255,255,255,.74)">{{ t.nlBody }}</p>
        <form onSubmit="{{ subscribe }}" style="display:flex;flex-wrap:wrap;gap:8px">
          <input name="nl_email" type="email" required placeholder="{{ t.nlPlaceholder }}" aria-label="{{ t.nlPlaceholder }}" style="box-sizing:border-box;flex:1 1 150px;min-width:0;height:46px;padding:0 14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:999px;font-family:inherit;font-size:14px;color:#ffffff">
          <button type="submit" style="all:unset;box-sizing:border-box;cursor:pointer;height:46px;padding:0 22px;border-radius:999px;background:#ffffff;color:#041815;font-family:inherit;font-size:14px;font-weight:500;display:flex;align-items:center;transition:transform .18s cubic-bezier(.2,.7,.3,1)" style-hover="transform:translateY(-2px)" style-active="transform:scale(.985)">{{ t.nlBtn }}</button>
        </form>
        <sc-if value="{{ subscribed }}" hint-placeholder-val="{{ false }}">
          <span role="status" style="font-size:13px;color:#8fc4bb">{{ t.nlOk }}</span>
        </sc-if>
      </div>
    </div>
    <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:22px 0;border-block-start:1px solid rgba(255,255,255,.18)">
      <span style="font-size:13px;color:rgba(255,255,255,.62)">{{ copyright }}</span>
      <span style="font-size:13px;color:rgba(255,255,255,.62)">{{ taglineLine }}</span>
    </div>
  </div>
</footer>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;lang&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;ar&quot;,&quot;tsType&quot;:&quot;string&quot;}}">

const FT = {
  ar: {
    footerText:'شركة استثمارية وتشغيلية استراتيجية تبني وتشغّل منصات أعمال قابلة للتوسع.',
    fCompany:'الشركة', fContact:'التواصل',
    address:'حي الخالدية — جدة، المملكة العربية السعودية',
    nlLabel:'النشرة البريدية', nlBody:'تحديثات دورية عن منصاتنا واستثماراتنا.',

    tagline:['تمكين الأعمال','تسريع النمو','بناء المنظومات الاقتصادية'],
    links:[['من نحن','about.dc.html'],['نموذج الأعمال','model.dc.html'],['الاستراتيجية','strategy.dc.html'],['منظومتنا','ecosystem.dc.html'],['خارطة الطريق','roadmap.dc.html'],['تواصل معنا','contact.dc.html']]
  },
  en: {
    footerText:'A strategic investment and operating company building and operating scalable business platforms.',
    fCompany:'Company', fContact:'Contact',
    address:'Al Khalidiyah District — Jeddah, Kingdom of Saudi Arabia',
    nlLabel:'Newsletter', nlBody:'Periodic updates on our platforms and investments.',
    nlPlaceholder:'Your email address', nlBtn:'Subscribe', nlOk:'Subscribed. Thank you.',
    rights:'SEEM PRIME. All rights reserved.',
    tagline:['Empowering businesses','Accelerating growth','Building economic ecosystems'],
    links:[['About','about.dc.html'],['Business model','model.dc.html'],['Strategy','strategy.dc.html'],['Ecosystem','ecosystem.dc.html'],['Roadmap','roadmap.dc.html'],['Contact us','contact.dc.html']]
  }
};

class Component extends DCLogic {
  state = { subscribed: false };
  renderVals() {
    const lang = this.props.lang === 'en' ? 'en' : 'ar';
    const t = FT[lang];
    return {
      t,
      capStyle: "font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:" +
        (lang === 'ar' ? 'normal' : '.1em') + ';text-transform:' + (lang === 'ar' ? 'none' : 'uppercase') +
        ';color:rgba(255,255,255,.62)',
      links: t.links.map(([label, href], i) => ({ i, label, href })),
      subscribe: (e) => { e.preventDefault(); this.setState({ subscribed: true }); e.target.reset(); },
      subscribed: this.state.subscribed,
      copyright: '© ' + new Date().getFullYear() + ' ' + t.rights,
      taglineLine: t.tagline.join(' · '),
      mark: React.createElement('svg', { viewBox: '0 0 120 120', width: 40, height: 40, 'aria-hidden': 'true', style: { display: 'block', flex: '0 0 auto' } },
        MARK.map((p, i) => React.createElement('path', { key: i, d: p.d, fill: 'currentColor', fillRule: 'evenodd' })))
    };
  }
}

</script>
</body>
</html>
